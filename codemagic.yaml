workflows:
  ios-testflight:
    name: iOS to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.leisureryde.ride"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        IOS_DEPLOYMENT_TARGET: "14.0"
        APPLE_TEAM_ID: $apple_team_id
        EXPORT_OPTIONS_PLIST: "export_options.plist"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Prepare iOS Maps config
        script: |
          if [ -z "$GOOGLE_MAPS_API_KEY_IOS" ]; then
            echo "GOOGLE_MAPS_API_KEY_IOS is not set in Codemagic."
            exit 1
          fi
          cat > ios/Flutter/GoogleMaps.xcconfig <<EOF
          GOOGLE_MAPS_API_KEY_IOS = $GOOGLE_MAPS_API_KEY_IOS
          EOF

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Build iOS app
        script: flutter build ios --release --no-codesign

      - name: Archive and export IPA
        script: |
          ARCHIVE_PATH="$CM_BUILD_DIR/Runner.xcarchive"
          IPA_PATH="$CM_BUILD_DIR/ipa"

          xcodebuild -workspace "ios/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$CM_BUILD_DIR/$EXPORT_OPTIONS_PLIST" \
            -exportPath "$IPA_PATH" \
            -allowProvisioningUpdates

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - build/ios/ipa
      - build/ios/iphoneos/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - "Ibraheemakin201@gmail.com"
